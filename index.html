<style>

    --idle:#8DA0AF; --idle-bg:#23343F; --lamp-off:#3A4E5B; color-scheme:dark;

}
:root[data-theme="dark"]{
  --paper:#0D1822; --surface:#16252F; --ink:#E5EEF4; --ink2:#9DB1C2; --line:#2B3F4E;
  --accent:#62AEEA; --accent-ink:#06121C; --accent-soft:#1B3447;

<body>
<div class="app" id="app">
  <header class="top"><h1>Pursuit screen</h1><div class="sync" id="sync" role="status"><i></i><span>Connecting</span></div></header>
  <main id="main"><div class="empty"><h2>Loading shared data</h2><p>Offices, assumptions and pursuits load from the team’s shared copy.</p></div></main>
</div>
<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Drop a pin</button>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
/* ---------- Pursuit Screen engine: mirrors the Excel model ---------- */
const DEFAULT_ASSUMPTIONS = {
  speed: 45, circ: 1.3, mobil: 0.5,
  prod: 1600, ucomf: 0.70, umid: 0.80, umax: 0.85,
  rot: 5, rotmin: 3,
  loaded: 75, mile: 0.8, ahhrs: 3.5, prem: 1.5, alloc: 250,
  tgt: 0.30, walk: 0.10, band: 0.10,
  wprox: 30, wcap: 30, won: 15, wmar: 25,
  pb1: 0.5, pf1: 1, pb2: 0.75, pf2: 0.7, pb3: 1, pf3: 0.4,
  cf2: 0.65, cf3: 0.35, mf2: 0.7, mf3: 0.3,
  go: 75, cond: 60,
  expandMin: 3, officeMin: 8, clusterR: 60, local: 0.5, officeFixed: 300000, satFixed: 50000
};
const DEFAULT_TIERS = [
  { name: "A - Time & Material", target: 0, after: 0 },
  { name: "B - Phone & Remote", target: 0, after: 0 },
  { name: "C - Preferred", target: 4, after: 1 },
  { name: "D - Premier", target: 2, after: 1 }
];

const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? 0 : Number(v);
const has = (v) => v !== null && v !== undefined && v !== "" && !isNaN(Number(v));
const rad = (d) => d * Math.PI / 180;

function roadMiles(a, lat1, lon1, lat2, lon2) {
  const h = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
  return 3959 * 2 * Math.asin(Math.sqrt(h)) * a.circ;
}

function tierInfo(S, tierName) {
  const t = S.tiers.find((x) => x.name === tierName);
  return t ? { target: num(t.target), after: num(t.after) } : { target: 0, after: 0 };
}

/* Evaluate one pursuit against the offices. Does not need other pursuits. */
function evalPursuit(S, p) {
  const A = S.A, offs = S.offices.filter((o) => o.name && has(o.lat) && has(o.lon));
  const r = { p, ok: false };
  const mech = num(p.mech), ctrl = num(p.ctrl), pm = num(p.pm), corr = num(p.corr), calls = num(p.calls);
  const rev = num(p.rev), other = num(p.other), strat = num(p.strat);
  const ti = tierInfo(S, p.tier);
  const target = has(p.rfp) ? num(p.rfp) : ti.target;
  const allowed = target > 0 ? Math.max(0, target - A.mobil) : null;
  const ahReq = (p.ah === "Yes") ? 1 : (p.ah === "No") ? 0 : ti.after;
  r.target = target; r.allowed = allowed; r.ahReq = ahReq === 1;
  r.hasCoords = has(p.lat) && has(p.lon) && offs.length > 0;
  r.actions = []; r.findings = [];
  if (!r.hasCoords) {
    r.g1 = "NO COORDS"; r.g2 = "NO COORDS"; r.g3 = "N/A"; r.g4 = "NO DATA";
    r.rec = "INCOMPLETE DATA"; r.score = 0; r.gap = "";
    r.actions.push(offs.length === 0 ? "Add at least one office with coordinates in Setup." : "Add the site location by pasting a map link or coordinates.");
    return r;
  }
  const split = (mech + ctrl) > 0 ? mech / (mech + ctrl) : 0;
  const splitC = (mech + ctrl) > 0 ? ctrl / (mech + ctrl) : 0;
  // per-office fit
  const fits = offs.map((o, j) => {
    const miles = roadMiles(A, num(p.lat), num(p.lon), num(o.lat), num(o.lon));
    const hrs = miles / A.speed;
    const inRange = target === 0 ? 1 : (hrs <= allowed ? 1 : 0);
    const Z = (pm + corr) * 2 * hrs;
    const mHP = mech > 0 ? Math.max(0, Math.ceil((num(o.cm) + mech + Z * split) / (A.prod * A.umax)) - num(o.mech), ahReq ? A.rotmin - num(o.mech) : 0) : 0;
    const cHP = ctrl > 0 ? Math.max(0, Math.ceil((num(o.cc) + ctrl + Z * splitC) / (A.prod * A.umax)) - num(o.ctrl), ahReq ? A.rotmin - num(o.ctrl) : 0) : 0;
    return { o, j, miles, hrs, inRange, metric: inRange ? (mHP + cHP) * 1000 + miles : null };
  });
  const inr = fits.filter((f) => f.metric !== null);
  r.inRangeCount = target === 0 ? fits.length : fits.filter((f) => f.inRange === 1).length;
  const nearest = fits.reduce((a, b) => (b.miles < a.miles ? b : a));
  const serve = inr.length ? inr.reduce((a, b) => (b.metric < a.metric ? b : a)) : nearest;
  const o = serve.o;
  r.office = o.name; r.miles = serve.miles; r.hrs = serve.hrs; r.nearest = nearest.o.name;
  const Z = (pm + corr) * 2 * serve.hrs;
  const AA = (mech + ctrl) === 0 ? 0 : mech + Z * split;
  const AB = (mech + ctrl) === 0 ? 0 : ctrl + Z * splitC;
  r.AA = AA; r.AB = AB;
  // gate 1
  r.g1 = target === 0 ? "N/A" : (serve.hrs <= allowed ? "PASS" : "FAIL");
  // gate 2
  r.mutil = mech > 0 ? (num(o.mech) === 0 ? 9.99 : (num(o.cm) + AA) / (num(o.mech) * A.prod)) : null;
  r.cutil = ctrl > 0 ? (num(o.ctrl) === 0 ? 9.99 : (num(o.cc) + AB) / (num(o.ctrl) * A.prod)) : null;
  const umaxv = Math.max(r.mutil ?? 0, r.cutil ?? 0);
  r.util = umaxv;
  r.g2 = umaxv <= A.umax ? "PASS" : "FAIL";
  // gate 3
  const d = Math.min(mech > 0 ? num(o.mech) : 999, ctrl > 0 ? num(o.ctrl) : 999);
  r.depth = d === 999 ? null : d;
  r.g3 = !r.ahReq ? "N/A" : r.depth === null ? "N/A" : r.depth >= A.rot ? "PASS" : r.depth >= A.rotmin ? "SUPPLEMENT" : "FAIL";
  // cost / margin
  const trips = pm + corr + calls;
  r.cost = (mech + ctrl) * A.loaded + trips * (2 * serve.hrs * A.loaded + 2 * serve.miles * A.mile) +
    calls * A.ahhrs * A.loaded * A.prem + calls * A.alloc + other;
  r.margin = rev > 0 ? (rev - r.cost) / rev : null;
  r.g4 = r.margin === null ? "NO DATA" : r.margin >= A.walk ? "PASS" : "FAIL";
  // points
  const ratio = (allowed && allowed > 0) ? serve.hrs / allowed : null;
  r.ppts = r.g1 === "N/A" ? A.wprox : (allowed === 0 ? 0 : A.wprox * (ratio <= A.pb1 ? A.pf1 : ratio <= A.pb2 ? A.pf2 : ratio <= A.pb3 ? A.pf3 : 0));
  r.cpts = A.wcap * (umaxv <= A.ucomf ? 1 : umaxv <= A.umid ? A.cf2 : umaxv <= A.umax ? A.cf3 : 0);
  r.opts = (r.g3 === "PASS" || r.g3 === "N/A") ? A.won : r.g3 === "SUPPLEMENT" ? A.won * 0.5 : 0;
  r.mpts = r.margin === null ? 0 : A.wmar * (r.margin >= A.tgt + A.band ? 1 : r.margin >= A.tgt ? A.mf2 : r.margin >= A.tgt - A.band ? A.mf3 : 0);
  r.strat = strat;
  r.score = Math.max(0, Math.min(100, r.ppts + r.cpts + r.opts + r.mpts + strat));
  const anyFail = [r.g1, r.g2, r.g3, r.g4].includes("FAIL");
  r.rec = r.g4 === "NO DATA" ? "INCOMPLETE DATA" : anyFail ? "NO-GO" : (r.score >= A.go && r.g3 !== "SUPPLEMENT") ? "GO" : r.score >= A.cond ? "CONDITIONAL" : "NO-GO";
  // hires
  const skip = r.g1 === "FAIL";
  const hire = (hrsC, hrsAdd, techs, util, rotTarget, need) => need > 0
    ? Math.max(0, Math.ceil((hrsC + hrsAdd) / (A.prod * util)) - techs, r.ahReq ? rotTarget - techs : 0) : 0;
  r.hpm = skip ? null : hire(num(o.cm), AA, num(o.mech), A.umax, A.rotmin, mech);
  r.hpc = skip ? null : hire(num(o.cc), AB, num(o.ctrl), A.umax, A.rotmin, ctrl);
  r.hsm = skip ? null : hire(num(o.cm), AA, num(o.mech), A.ucomf, A.rot, mech);
  r.hsc = skip ? null : hire(num(o.cc), AB, num(o.ctrl), A.ucomf, A.rot, ctrl);
  r.revneed = r.cost / (1 - A.tgt);
  r.pricepct = rev > 0 ? Math.max(0, r.revneed / rev - 1) : null;
  // local-base view
  r.lcost = (mech + ctrl) * A.loaded + trips * (2 * A.local * A.loaded + 2 * A.local * A.speed * A.mile) +
    calls * A.ahhrs * A.loaded * A.prem + calls * A.alloc + other;
  r.lmargin = rev > 0 ? (rev - r.lcost) / rev : null;
  r.gap = (r.g4 === "NO DATA") ? "" : r.g1 === "FAIL" ? ((r.lmargin !== null && r.lmargin >= A.walk) ? "RANGE" : "")
    : (r.g4 === "PASS" && (r.g2 === "FAIL" || r.g3 === "FAIL" || r.g3 === "SUPPLEMENT")) ? "CAPACITY" : "";
  // findings and actions (plain sentences)
  const pct = (x) => Math.round(x * 100) + "%";
  const money = (x) => "$" + Math.round(x).toLocaleString("en-US");
  if (r.g1 === "FAIL") r.findings.push("Outside response range of every office: " + serve.hrs.toFixed(1) + " hr drive from " + o.name + " vs " + allowed.toFixed(1) + " hr allowed.");
  if (r.g2 === "FAIL") r.findings.push("Over capacity at " + o.name + " (" + pct(umaxv) + " utilization after the win).");
  if (r.g3 === "FAIL") r.findings.push("On-call rotation too thin (" + r.depth + " techs; need " + A.rotmin + "+).");
  if (r.g3 === "SUPPLEMENT") r.findings.push("Thin rotation (" + r.depth + " techs vs " + A.rot + " ideal): needs a remote-only second tier.");
  if (r.g4 === "FAIL") r.findings.push("Margin " + pct(r.margin) + " is below the walk-away level.");
  if (r.g4 === "PASS" && r.margin < A.tgt) r.findings.push("Margin " + pct(r.margin) + " is below target.");
  if (!r.findings.length) r.findings.push("All gates passed. Served from " + o.name + ".");
  const cT = (S.tiers.find((x) => x.name === "C - Preferred") || { target: 4 }).target;
  if (r.g1 === "FAIL") {
    if (target > 0 && cT > target && serve.hrs <= cT - A.mobil)
      r.actions.push("Re-scope as Preferred (" + cT + "-hr L1) if the customer accepts: the " + serve.hrs.toFixed(1) + " hr drive fits.");
    else r.actions.push("Out of range of every office: needs a local team (see Growth) or offer remote-only Option B.");
  }
  const hl = (m, c) => [m > 0 ? m + " mechanic" + (m > 1 ? "s" : "") : "", c > 0 ? c + " controls technician" + (c > 1 ? "s" : "") : ""].filter(Boolean).join(" and ");
  if (num(r.hpm) > 0 || num(r.hpc) > 0) r.actions.push("Hire " + hl(num(r.hpm), num(r.hpc)) + " at " + o.name + " to clear the gates.");
  if (num(r.hsm) > num(r.hpm) || num(r.hsc) > num(r.hpc))
    r.actions.push("In total, a comfortable fit (at most " + pct(A.ucomf) + " utilization, full rotation) needs " + hl(num(r.hsm), num(r.hsc)) + " at " + o.name + ".");
  if (r.margin !== null && r.margin < A.tgt) r.actions.push("Reprice to about " + money(r.revneed) + " (+" + pct(r.pricepct) + ") to reach the target margin.");
  if (r.gap === "RANGE") r.actions.push("Served from a local base the margin would be " + pct(r.lmargin) + ": this counts toward new-area demand on Growth.");
  if (!r.actions.length) r.actions.push("Pursue as scoped. No improvement needed.");
  r.ok = true;
  return r;
}

/* Whole-portfolio evaluation: each pursuit plus the Growth Plan roll-ups. */
function evalAll(S) {
  const A = S.A;
  const results = S.pursuits.map((p) => evalPursuit(S, p));
  const offs = S.offices.filter((o) => o.name && has(o.lat) && has(o.lon));
  const live = results.filter((r) => r.ok);

  /* A. existing offices */
  const planned = (techsHrs, util) => Math.ceil(techsHrs / (A.prod * util));
  const officeRows = offs.map((o) => {
    const mine = live.filter((r) => r.office === o.name);
    const go = mine.filter((r) => r.rec === "GO");
    const gap = mine.filter((r) => r.gap === "CAPACITY");
    const sum = (arr, k) => arr.reduce((a, r) => a + num(r[k]), 0);
    const row = {
      name: o.name, mech: num(o.mech), ctrl: num(o.ctrl), goCount: go.length, gapCount: gap.length,
      gapRev: gap.reduce((a, r) => a + num(r.p.rev), 0), gapProfit: gap.reduce((a, r) => a + num(r.p.rev) - num(r.cost), 0)
    };
    row.mechGo = planned(num(o.cm) + sum(go, "AA"), A.ucomf);
    row.mechAll = planned(num(o.cm) + sum(go, "AA") + sum(gap, "AA"), A.ucomf);
    row.ctrlGo = planned(num(o.cc) + sum(go, "AB"), A.ucomf);
    row.ctrlAll = planned(num(o.cc) + sum(go, "AB") + sum(gap, "AB"), A.ucomf);
    const rotM = gap.some((r) => r.ahReq && num(r.p.mech) > 0), rotC = gap.some((r) => r.ahReq && num(r.p.ctrl) > 0);
    row.addMech = row.gapCount === 0 ? 0 : Math.max(0, Math.max(row.mechAll, rotM ? A.rot : 0) - Math.max(row.mech, row.mechGo));
    row.addCtrl = row.gapCount === 0 ? 0 : Math.max(0, Math.max(row.ctrlAll, rotC ? A.rot : 0) - Math.max(row.ctrl, row.ctrlGo));
    row.addTotal = row.addMech + row.addCtrl;
    row.perHireRev = row.addTotal > 0 ? row.gapRev / row.addTotal : null;
    row.perHireProfit = row.addTotal > 0 ? row.gapProfit / row.addTotal : null;
    row.level = row.gapCount === 0 ? "none" : row.addTotal >= A.officeMin ? "office" : row.addTotal >= A.expandMin ? "hire" : row.addTotal >= 1 ? "small" : "absorb";
    row.verdict = row.level === "none" ? "No staffing-gap demand"
      : row.level === "office" ? "Full office case: " + row.addTotal + " added techs (" + row.addMech + " mechanic, " + row.addCtrl + " controls) is enough to merit a new office in this area."
      : row.level === "hire" ? "Hire " + row.addTotal + " at " + o.name + " (" + row.addMech + " mechanic, " + row.addCtrl + " controls): justified."
      : row.level === "small" ? "Hire " + row.addTotal + " as deals close; below the " + A.expandMin + "-hire trigger."
      : "Existing staff can absorb the gap pursuits.";
    return row;
  });

  /* B. out-of-range clusters */
  const idxs = results.map((r, i) => (r.ok && r.gap === "RANGE") ? i : -1).filter((i) => i >= 0);
  const D = (i, j) => roadMiles(A, num(results[i].p.lat), num(results[i].p.lon), num(results[j].p.lat), num(results[j].p.lon));
  const a1 = {}, a2 = {}, a3 = {};
  idxs.forEach((i) => { a1[i] = Math.min(...idxs.filter((j) => D(i, j) <= A.clusterR).map((j) => j + 1)); });
  idxs.forEach((i) => { a2[i] = Math.min(...idxs.filter((j) => D(i, j) <= A.clusterR).map((j) => a1[j])); });
  idxs.forEach((i) => { a3[i] = Math.min(...idxs.filter((j) => D(i, j) <= A.clusterR).map((j) => a2[j])); });
  results.forEach((r, i) => { r.cluster = (i in a3) ? a3[i] : null; });
  const keys = [...new Set(idxs.map((i) => a3[i]))].sort((a, b) => a - b);
  const clusters = keys.map((k) => {
    const mem = idxs.filter((i) => a3[i] === k).map((i) => results[i]);
    const hrsM = mem.reduce((a, r) => { const p = r.p, t = num(p.mech) + num(p.ctrl); return a + (t === 0 ? 0 : num(p.mech) + (num(p.pm) + num(p.corr)) * 2 * A.local * num(p.mech) / t); }, 0);
    const hrsC = mem.reduce((a, r) => { const p = r.p, t = num(p.mech) + num(p.ctrl); return a + (t === 0 ? 0 : num(p.ctrl) + (num(p.pm) + num(p.corr)) * 2 * A.local * num(p.ctrl) / t); }, 0);
    const rev = mem.reduce((a, r) => a + num(r.p.rev), 0), lcost = mem.reduce((a, r) => a + r.lcost, 0);
    const lat = mem.reduce((a, r) => a + num(r.p.lat), 0) / mem.length, lon = mem.reduce((a, r) => a + num(r.p.lon), 0) / mem.length;
    let nearO = null, nearD = Infinity;
    offs.forEach((o) => { const d = roadMiles(A, lat, lon, num(o.lat), num(o.lon)); if (d < nearD) { nearD = d; nearO = o.name; } });
    const mT = Math.ceil(hrsM / (A.prod * A.ucomf)), cT = Math.ceil(hrsC / (A.prod * A.ucomf)), total = mT + cT;
    const contrib = rev - lcost, afterOffice = contrib - A.officeFixed, afterSat = contrib - A.satFixed;
    const anyAh = mem.some((r) => r.ahReq);
    const thin = Math.min(hrsM > 0 ? mT : 999, hrsC > 0 ? cT : 999) < A.rotmin;
    const note = (anyAh && thin) ? " Note: after-hours coverage would need remote-only or shared on-call support." : "";
    const money = (x) => "$" + Math.round(Math.abs(x)).toLocaleString("en-US");
    let level, verdict;
    if (total >= A.officeMin) {
      if (afterOffice >= 0) { level = "office"; verdict = "New office justified: " + total + " techs, contribution clears office overhead."; }
      else { level = "short"; verdict = "Headcount (" + total + " techs) supports an office, but contribution is " + money(afterOffice) + " short of office overhead."; }
    } else if (total >= A.expandMin) {
      if (afterSat >= 0) { level = "team"; verdict = "Station a " + total + "-tech team in this area (extension of " + nearO + " or satellite): justified."; }
      else { level = "short"; verdict = "Team size (" + total + ") is enough, but contribution is " + money(afterSat) + " short of satellite overhead."; }
    } else { level = "small"; verdict = "Too small for a team (" + total + " tech" + (total === 1 ? "" : "s") + "): serve via remote Option B, a partner, or wait for more demand."; }
    return {
      key: k, anchorName: results[k - 1].p.name, ids: mem.map((r) => results.indexOf(r) + 1), members: mem,
      rev, lcost, contrib, hrsM, hrsC, mT, cT, total, lat, lon, nearO, nearD, afterOffice, afterSat,
      perTech: total > 0 ? rev / total : null, level, verdict: verdict + note
    };
  });
  return { results, officeRows, clusters };
}

/* ---------- Pin parsing: Google Maps, Apple Maps, geo: URIs, plain coordinates ---------- */
function parseLocation(raw) {
  if (!raw) return null;
  let t = String(raw).trim();
  if (!t) return null;
  if (/maps\.app\.goo\.gl|goo\.gl\/maps|maps\.apple\.com\/p\/|apple\.co\//i.test(t) && !/[-\d]\.\d{3,}\s*,\s*-?\d/.test(decodeURIComponent(t.replace(/%(?![0-9a-f]{2})/gi, "%25")))) {
    return { error: "short" };
  }
  let s = t;
  try { s = decodeURIComponent(t.replace(/%(?![0-9a-f]{2})/gi, "%25")); } catch (e) { s = t; }
  s = s.replace(/\+/g, " ");
  const ok = (la, lo) => isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180 && !(la === 0 && lo === 0);
  const out = (la, lo, src) => ok(la, lo) ? { lat: +(+la).toFixed(6), lon: +(+lo).toFixed(6), source: src } : null;
  let m;
  // Google place pin data
  if ((m = s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/))) { const r = out(m[1], m[2], "Google Maps link"); if (r) return r; }
  // query parameters (Apple ll/coordinate/q/sll/daddr, Google q/query/destination/center)
  const isApple = /maps\.apple\.com/i.test(s);
  const params = ["coordinate", "ll", "q", "query", "destination", "daddr", "center", "sll"];
  for (const key of params) {
    const re = new RegExp("[?&]" + key + "=([^&#]+)", "i");
    const mm = s.match(re);
    if (mm) {
      const c = mm[1].trim().replace(/^loc:/i, "").match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
      if (c) { const r = out(c[1], c[2], isApple ? "Apple Maps link" : "map link"); if (r) return r; }
    }
  }
  // Google viewport centre
  if ((m = s.match(/@(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/))) { const r = out(m[1], m[2], "Google Maps link"); if (r) return r; }
  // /place/lat,lon or /search/lat, lon
  if ((m = s.match(/\/(?:place|search)\/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/))) { const r = out(m[1], m[2], "Google Maps link"); if (r) return r; }
  // geo: URI
  if ((m = s.match(/geo:(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/i))) { const r = out(m[1], m[2], "geo link"); if (r) return r; }
  // DMS 38°41'53.5"N 90°09'22.0"W
  const dms = [...s.matchAll(/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:\.\d+)?)\s*["″”]?\s*([NSEW])/gi)];
  if (dms.length >= 2) {
    const conv = (x) => { let v = +x[1] + (+x[2]) / 60 + (+x[3]) / 3600; if (/[SW]/i.test(x[4])) v = -v; return { v, h: x[4].toUpperCase() }; };
    const a = conv(dms[0]), b = conv(dms[1]);
    const la = /[NS]/.test(a.h) ? a.v : b.v, lo = /[EW]/.test(a.h) ? a.v : b.v;
    const r = out(la, lo, "coordinates"); if (r) return r;
  }
  // decimal with hemisphere letters: 38.6982° N, 90.1561° W
  if ((m = s.match(/(-?\d{1,3}(?:\.\d+)?)\s*[°º]?\s*([NSEW])\b[\s,;]*(-?\d{1,3}(?:\.\d+)?)\s*[°º]?\s*([NSEW])\b/i))) {
    let a = +m[1], b = +m[3]; const ha = m[2].toUpperCase(), hb = m[4].toUpperCase();
    if (/[SW]/.test(ha)) a = -Math.abs(a); if (/[SW]/.test(hb)) b = -Math.abs(b);
    const la = /[NS]/.test(ha) ? a : b, lo = /[EW]/.test(ha) ? a : b;
    const r = out(la, lo, "coordinates"); if (r) return r;
  }
  // bare "lat, lon" anywhere in the text
  if ((m = s.match(/(-?\d{1,3}\.\d{2,})\s*[,;\s]\s*(-?\d{1,3}\.\d{2,})/))) { const r = out(m[1], m[2], "coordinates"); if (r) return r; }
  return { error: "none" };
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; $("toastHost").appendChild(t);
  setTimeout(() => t.remove(), 2600);

/* ============================ data layer (this phone only) ============================ */
const KEY = "pursuit-screen-standalone-v1";
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d) { S.pursuits = Array.isArray(d.pursuits) ? d.pursuits : []; ENV.sendTo = d.sendTo || ENV.sendTo; ENV.who = d.who || ""; }
  } catch (e) { ENV.storage = false; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ pursuits: S.pursuits, sendTo: ENV.sendTo, who: ENV.who })); ENV.storage = true; } catch (e) { ENV.storage = false; }
  setSync();
}
const unsent = () => S.pursuits.filter((p) => !p.sentAt);
function setSync() {
  const el = $("sync"), n = unsent().length;
  el.className = "sync " + (!ENV.storage ? "warn" : n ? "warn" : "live");
  el.querySelector("span").textContent = !ENV.storage ? "Not saving on this phone" : n ? n + " not sent yet" : "Saved on this phone";
}
function sortedPursuits() { return [...S.pursuits].sort((a, b) => num(a.createdAt) - num(b.createdAt) || String(a.id).localeCompare(String(b.id))); }
function recompute() {
  S.pursuits = sortedPursuits();
  R = evalAll(S);
  if (document.activeElement && $("main").contains(document.activeElement) && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { pendingRender = true; return; }
  render();
}
async function savePursuit(p) {
  const id = p.id || ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const rec = { ...p, id };
  Object.keys(rec).forEach((k) => { if (rec[k] === undefined) rec[k] = null; });
  const i = S.pursuits.findIndex((x) => x.id === id);
  if (i >= 0) S.pursuits[i] = rec; else S.pursuits.push(rec);
  persist(); recompute(); return id;
}
async function deletePursuit(id) { S.pursuits = S.pursuits.filter((x) => x.id !== id); persist(); recompute(); }
function markSent(list) { const ids = new Set(list.map((p) => p.id)); S.pursuits.forEach((p) => { if (ids.has(p.id)) p.sentAt = Date.now(); }); persist(); recompute(); }

/* ============================ shared UI bits ============================ */
function lampClass(g) { return (g === "PASS" || g === "N/A") ? "pass" : g === "SUPPLEMENT" ? "warn" : g === "FAIL" ? "fail" : ""; }
function lampsHTML(r) {
  const L = [["Range", r.g1], ["Capacity", r.g2], ["On-call", r.g3], ["Margin", r.g4]];
  return '<div class="lamps">' + L.map(([n, g]) => '<span class="lamp ' + lampClass(g) + '"><i></i>' + n + "</span>").join("") + "</div>";
}
function gateText(r) {
  const rng = r.g1 === "N/A" ? "No on-site clock" : r.g1 === "NO COORDS" ? "No location yet" : r.hrs.toFixed(1) + " of " + r.allowed.toFixed(1) + " hr drive";
  const capN = r.mutil === null && r.cutil === null ? "No hours entered" : pct(r.util) + " busiest skill after win";
  const oc = r.g3 === "N/A" ? (r.ahReq ? "Not applicable" : "No after-hours field coverage") : r.depth + " techs on the rotation";
  const mg = r.margin === null ? "Enter revenue" : pct(r.margin) + " (target " + pct(S.A.tgt) + ")";
  return { rng, capN, oc, mg };
}
function sheetOpen(title, body, foot) {
  sheetClose();
  const h = document.createElement("div"); h.className = "sheet-wrap"; h.id = "sheetWrap";
  h.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" type="button" aria-label="Close" id="sheetX">' + ICON.x + '</button></div><div class="sheet-body" id="sheetBody">' + body + "</div>" + (foot ? '<div class="sheet-foot" id="sheetFoot">' + foot + "</div>" : "") + "</div>";
  $("sheetHost").appendChild(h);
  h.addEventListener("click", (e) => { if (e.target === h) sheetClose(); });
  $("sheetX").addEventListener("click", sheetClose);
  document.body.style.overflow = "hidden";
}
function sheetClose() { const w = $("sheetWrap"); if (w) w.remove(); document.body.style.overflow = ""; if (pendingRender) { pendingRender = false; render(); } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") sheetClose(); });

/* ============================ views ============================ */
function render() {
  $("tabs").innerHTML = [["pursuits", "Pursuits", ICON.list], ["map", "Map", ICON.map], ["setup", "More", ICON.setup]]
    .map(([k, n, ic]) => '<button type="button" data-tab="' + k + '"' + (view === k ? ' aria-current="page"' : "") + ">" + ic + "<span>" + n + "</span></button>").join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.tab; window.scrollTo(0, 0); render(); }));
  $("fab").style.display = (view === "pursuits" || view === "map") ? "flex" : "none";
  if (!R) return;
  const extra = ENV.storage ? "" : '<div class="banner">This browser can’t save data (private browsing?). Pursuits will be lost when you close the page, so send them before leaving.</div>';
  $("main").innerHTML = extra + (view === "pursuits" ? vPursuits() : view === "map" ? vMap() : vSetup());
  bindView();
}
function bindView() {
  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openDetail(b.dataset.open)));
  document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.filter; render(); }));
  const sa = $("bSendAll"); if (sa) sa.addEventListener("click", () => openSend(unsent()));
  if (view === "setup") bindSetup();
  if (view === "map") {
    const f = $("mapFocus"), r = $("mapRing");
    if (f) f.addEventListener("change", () => { mapFocus = f.value; render(); });
    if (r) r.addEventListener("change", () => { mapRing = r.value; render(); });
  }
}
function sendBar() {
  const n = unsent().length; if (!n) return "";
  return '<div class="banner info" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>' + n + " not sent to the office yet</span>" +
    '<button class="btn pri" id="bSendAll" type="button" style="min-height:40px">Send</button></div>';
}
const ORDER = { "GO": 0, "CONDITIONAL": 1, "NO-GO": 2, "INCOMPLETE DATA": 3 };
function vPursuits() {
  const res = R.results;
  const cnt = (k) => res.filter((r) => r.rec === k).length;
  let html = sendBar();
  if (!S.offices.length) html += '<div class="banner info">Add your offices first (Setup tab) so pursuits can be screened against them.</div>';
  if (!res.length) {
    return html + '<div class="empty"><h2>No pursuits yet</h2><p>Drop a pin from Apple Maps or Google Maps to screen your first contract opportunity.</p></div>';
  }
  html += '<div class="seg" role="group" aria-label="Filter by result">' +
    [["all", "All", res.length], ["GO", "Go", cnt("GO")], ["CONDITIONAL", "Conditional", cnt("CONDITIONAL")], ["NO-GO", "No-go", cnt("NO-GO")]]
      .map(([k, n, c]) => '<button type="button" data-filter="' + k + '" aria-pressed="' + (filter === k) + '"><b>' + c + "</b>" + n + "</button>").join("") + "</div>";
  const shown = res.map((r, i) => ({ r, i })).filter((x) => filter === "all" || x.r.rec === filter)
    .sort((a, b) => (ORDER[a.r.rec] - ORDER[b.r.rec]) || (b.r.score - a.r.score));
  if (!shown.length) return html + '<div class="empty"><h2>Nothing here</h2><p>No pursuits have this result.</p></div>';
  html += '<ul class="list">' + shown.map(({ r }) => {
    const p = r.p, c = recCls(r.rec);
    const sub = r.ok ? "From " + esc(r.office) + ", " + r.hrs.toFixed(1) + " hr drive" : "Location needed";
    return '<li><button class="row ' + c + '" type="button" data-open="' + esc(p.id) + '"><span class="stripe"></span><span class="mid"><span class="hd" style="display:block"><p class="nm">' + esc(p.name) + '</p><p class="sub">' + sub + "</p></span>" + (r.ok ? lampsHTML(r) : "") + '</span><span class="sc"><b>' + (r.ok ? Math.round(r.score) : "–") + '</b><span class="chip ' + c + '">' + REC[r.rec] + "</span></span></button></li>";
  }).join("") + "</ul>";
  return html;
}

/* ---------- detail ---------- */
function mapLinks(p) {
  const a = "https://maps.apple.com/?ll=" + p.lat + "," + p.lon + "&q=" + encodeURIComponent(p.name || "Site");
  const g = "https://www.google.com/maps/search/?api=1&query=" + p.lat + "," + p.lon;
  return '<a class="btn" href="' + a + '" target="_blank" rel="noopener">Open in Apple Maps</a><a class="btn" href="' + g + '" target="_blank" rel="noopener">Open in Google Maps</a>';
}
function openDetail(id) {
  const r = R.results.find((x) => x.p.id === id); if (!r) return;
  const p = r.p, c = recCls(r.rec), g = r.ok ? gateText(r) : null;
  let body = '<div class="verdict-big ' + c + '"><b>' + REC[r.rec] + "</b><span>" + (r.ok ? "Score " + Math.round(r.score) + " of 100" : "") + "</span></div>";
  if (r.ok) {
    body += '<div class="gates">' +
      [["Range", r.g1, g.rng], ["Capacity", r.g2, g.capN], ["On-call", r.g3, g.oc], ["Margin", r.g4, g.mg]]
        .map(([n, gg, t]) => '<div class="gate"><span class="lamp ' + lampClass(gg) + '"><i></i>' + n + "</span><p>" + esc(t) + "</p></div>").join("") + "</div>";
  }
  body += '<h3 class="sec">What to do</h3><ul class="acts">' + r.actions.map((a) => "<li>" + esc(a) + "</li>").join("") + "</ul>";
  if (r.ok) {
    body += '<h3 class="sec">Why</h3><ul class="why">' + r.findings.map((a) => "<li>" + esc(a) + "</li>").join("") + "</ul>";
    const hire = (m, cc) => (num(m) || num(cc)) ? (num(m) + " mechanic, " + num(cc) + " controls") : "None";
    body += '<h3 class="sec">Numbers</h3><dl class="kv">' +
      "<dt>Served from</dt><dd>" + esc(r.office) + "</dd><dt>Road distance</dt><dd>" + Math.round(r.miles) + " mi, " + r.hrs.toFixed(1) + " hr</dd>" +
      "<dt>Offices in range</dt><dd>" + (r.target === 0 ? "No on-site clock" : r.inRangeCount) + "</dd>" +
      (p.ptype ? "<dt>Project</dt><dd>" + esc(p.ptype) + (has(p.psize) ? ", " + Number(p.psize).toLocaleString("en-US") : "") + "</dd>" : "") + "<dt>Annual revenue</dt><dd>" + money(num(p.rev)) + "</dd><dt>Estimated cost</dt><dd>" + money(r.cost) + "</dd><dt>Margin</dt><dd>" + pct(r.margin) + "</dd>" +
      "<dt>Revenue for target margin</dt><dd>" + money(r.revneed) + "</dd>" +
      (r.hpm === null ? "" : "<dt>Hires to clear gates</dt><dd>" + hire(r.hpm, r.hpc) + "</dd><dt>Hires for comfortable fit</dt><dd>" + hire(r.hsm, r.hsc) + "</dd>") +
      "</dl>";
  }
  if (p.notes) body += '<h3 class="sec">Notes</h3><p>' + esc(p.notes) + "</p>";
  body += '<h3 class="sec">Location</h3><p class="note">' + (has(p.lat) ? Number(p.lat).toFixed(5) + ", " + Number(p.lon).toFixed(5) : "Not set") + '. ' + (p.sentAt ? 'Sent ' + new Date(p.sentAt).toLocaleDateString() + '.' : 'Not sent to the office yet.') + '</p>';
  if (has(p.lat)) body += '<div class="btns">' + mapLinks(p) + "</div>";
  const foot = ENV.canWrite ? '<div class="btns" style="margin:0"><button class="btn pri" type="button" id="dSend" style="flex:1">Send</button><button class="btn" type="button" id="dEdit">Edit</button><button class="btn danger" type="button" id="dDel">Delete</button></div>' : "";
  sheetOpen(p.name || "Pursuit", body, foot);
  if (ENV.canWrite) {
    $("dEdit").addEventListener("click", () => openForm(S.pursuits.find((x) => x.id === id)));
    $("dSend").addEventListener("click", () => openSend([p]));
    const del = $("dDel"); let armed = false;
    del.addEventListener("click", async () => {
      if (!armed) { armed = true; del.textContent = "Tap again to delete"; del.classList.add("armed"); setTimeout(() => { armed = false; del.textContent = "Delete"; del.classList.remove("armed"); }, 3500); return; }
      try { await deletePursuit(id); sheetClose(); toast("Pursuit deleted"); } catch (e) { toast("Couldn’t delete: you may not have edit access."); }
    });
  }
}

  const f = (k, label, extra) => '<label class="fld"><span>' + label + '</span><input data-f="' + k + '" inputmode="decimal" autocomplete="off" value="' + esc(p[k] ?? "") + '"' + (extra || "") + "></label>";

    '<h3 class="sec">Contract</h3>' +
    '<label class="fld"><span>Name</span><input data-f="name" autocomplete="off" value="' + esc(p.name ?? "") + '" placeholder="Customer and site"></label>' +
    '<label class="fld"><span>Support tier</span><select data-f="tier">' + S.tiers.map((t) => '<option value="' + esc(t.name) + '"' + (t.name === p.tier ? " selected" : "") + ">" + esc(t.name) + "</option>").join("") + "</select></label>" +
    '<h3 class="sec">Estimate from project type</h3><p class="note" style="margin:0 0 8px">Optional. Choose a project type and size, then tap Estimate to fill the work and revenue fields below. Anything you change afterward overrides the estimate.</p>' +
    '<label class="fld"><span>Project type</span><select data-f="ptype"><option value="">Not estimating</option>' + DEFAULT_LIBRARY.types.map((t) => '<option value="' + esc(t.name) + '"' + (t.name === p.ptype ? " selected" : "") + ">" + esc(t.name) + "</option>").join("") + "</select></label>" +
    '<div class="g2"><label class="fld"><span id="sizeLbl">Size</span><input data-f="psize" inputmode="decimal" autocomplete="off" value="' + esc(p.psize ?? "") + '"></label><label class="fld"><span>Complexity (1 = typical)</span><input data-f="cx" inputmode="decimal" autocomplete="off" value="' + esc(p.cx ?? "") + '" placeholder="1"></label></div>' +
    '<div class="btns"><button class="btn" type="button" id="bEst">Estimate hours and value</button></div><div class="pin-status" id="estStatus" style="display:none"></div>' +
    '<h3 class="sec">Work per year</h3>' +
    '<div class="g2">' + f("mech", "Mechanical hours") + f("ctrl", "Controls hours") + f("pm", "PM visits") + f("corr", "Corrective visits") + "</div>" + f("calls", "After-hours call-outs") +
    '<h3 class="sec">Money per year</h3>' +
    '<div class="g2">' + f("rev", "Contract revenue ($)") + f("other", "Parts, monitoring, tools ($)") + "</div>" +
    '<h3 class="sec">Optional</h3>' +
    '<div class="g2">' + f("rfp", "RFP on-site response (hrs)") + '<label class="fld"><span>24/7 field coverage</span><select data-f="ah"><option value="">Tier default</option><option value="Yes"' + (p.ah === "Yes" ? " selected" : "") + '>Required</option><option value="No"' + (p.ah === "No" ? " selected" : "") + ">Not required</option></select></label></div>" +
    f("strat", "Strategic adjustment (-10 to +10 points)") +
    '<label class="fld"><span>Notes</span><textarea data-f="notes" rows="2">' + esc(p.notes ?? "") + "</textarea></label>";
  const foot = '<div class="preview" id="prev"></div><div id="formErr" class="note" style="color:var(--stop)"></div><div class="btns" style="margin:8px 0 0"><button class="btn pri block" type="button" id="bSave">' + (isNew ? "Save pursuit" : "Save changes") + "</button></div>";
  sheetOpen(isNew ? "Drop a pin" : "Edit pursuit", body, foot);
  const val = (k) => { const el = document.querySelector('[data-f="' + k + '"]'); return el ? el.value.trim() : ""; };
  const numv = (k) => { const v = val(k); return v === "" || isNaN(Number(v)) ? null : Number(v); };
  const draft = () => ({ ...p, name: val("name"), tier: val("tier"), lat: numv("lat"), lon: numv("lon"), mech: numv("mech"), ctrl: numv("ctrl"), pm: numv("pm"), corr: numv("corr"), calls: numv("calls"), rev: numv("rev"), other: numv("other"), rfp: numv("rfp"), ah: val("ah"), strat: numv("strat"), notes: val("notes"), ptype: val("ptype"), psize: numv("psize"), cx: numv("cx") });
  const setStatus = (cls, msg) => { const el = $("pinStatus"); el.className = "pin-status " + cls; el.textContent = msg; };
  const preview = () => {
    const d = draft(), r = evalPursuit(S, d), c = recCls(r.rec);
    $("prev").innerHTML = '<span class="big chip ' + c + '" style="font-size:22px;padding:4px 10px">' + REC[r.rec] + '</span><div><p>' + (r.ok ? "Score " + Math.round(r.score) + ", from " + esc(r.office) + ", " + r.hrs.toFixed(1) + " hr drive" : "Add a location to screen this site.") + "</p>" + (r.ok ? lampsHTML(r) : "") + "</div>";
    if (r.ok && has(d.lat)) setStatus("ok", "Pin set at " + d.lat.toFixed(5) + ", " + d.lon.toFixed(5) + ". Nearest office: " + r.nearest + ".");
    else if (!has(d.lat)) setStatus("", "No location yet.");
  };
  const applyLoc = (txt) => {
    const res = parseLocation(txt); if (!res) return;
    if (res.error === "short") { setStatus("bad", "That’s a short link, so it has no coordinates inside. Type the site address above and tap Find address, tap Use my location if you’re at the site, or copy the pin’s coordinates from the map app."); return; }
    if (res.error) { setStatus("bad", "Couldn’t find coordinates in that text. Paste a map link or numbers like 38.6982, -90.1561."); return; }
    document.querySelector('[data-f="lat"]').value = res.lat; document.querySelector('[data-f="lon"]').value = res.lon;
    preview(); const el = $("pinStatus"); el.textContent = "From a " + res.source + ": " + res.lat + ", " + res.lon + ". " + el.textContent.replace(/^Pin set at [^.]*\.\s*/, "");
  };
  const sizeLabel = () => { const t = DEFAULT_LIBRARY.types.find((x) => x.name === val("ptype")); $("sizeLbl").textContent = t ? "Size (" + t.unit + ")" : "Size"; };
  const estStatus = (cls, msg) => { const el = $("estStatus"); el.style.display = "block"; el.className = "pin-status " + cls; el.textContent = msg; };
  $("bEst").addEventListener("click", () => {
    const d = draft(), e = estimateProject(S, { type: d.ptype, size: d.psize, cx: d.cx, tier: d.tier });

    const set = (k, v) => { document.querySelector('[data-f="' + k + '"]').value = v; };
    set("mech", Math.round(e.mech)); set("ctrl", Math.round(e.ctrl)); set("pm", Math.round(e.pm)); set("corr", Math.round(e.corr)); set("calls", Math.round(e.calls)); set("other", Math.round(e.other / 10) * 10);
    let msg = "Estimated from " + d.ptype + ", " + Number(d.psize).toLocaleString("en-US") + " " + e.unit + ": " + Math.round(e.mech) + " mechanical and " + Math.round(e.ctrl) + " controls hours a year.";
    if (e.value !== null) {
      set("rev", Math.round(e.value / 100) * 100);
      const fmtU = (x) => x < 10 ? "$" + x.toFixed(2) : "$" + Math.round(x).toLocaleString("en-US");
      msg += " Agreement value about " + money(e.value) + " a year (" + fmtU(e.perUnit) + " per " + e.unit + ", " + e.bench + " the typical " + fmtU(e.lo) + " to " + fmtU(e.hi) + ").";
    } else msg += " This tier isn’t priced as an agreement, so enter revenue yourself.";
    estStatus("ok", msg); preview();
  });
  $("sizeLbl") && document.querySelector('[data-f="ptype"]').addEventListener("change", sizeLabel); sizeLabel();
  $("loc").addEventListener("input", () => applyLoc($("loc").value));
  $("bPaste").addEventListener("click", async () => {
    try { const t = await navigator.clipboard.readText(); $("loc").value = t; applyLoc(t); }
    catch (e) { setStatus("bad", "Clipboard access was blocked. Press and hold in the box above and choose Paste."); $("loc").focus(); }
  });
  $("bLoc").addEventListener("click", () => {
    if (!navigator.geolocation) { setStatus("bad", "Location isn’t available here. Paste a map link instead."); return; }
    setStatus("", "Finding your location…");
    navigator.geolocation.getCurrentPosition((pos) => {
      document.querySelector('[data-f="lat"]').value = +pos.coords.latitude.toFixed(6); document.querySelector('[data-f="lon"]').value = +pos.coords.longitude.toFixed(6); preview();
    }, () => setStatus("bad", "Location was blocked or unavailable. Paste a map link instead."), { enableHighAccuracy: true, timeout: 12000 });
  });
  $("bAddr").addEventListener("click", async () => {
    const q = $("addr").value.trim(); if (!q) return;
    const box = $("addrRes"); box.innerHTML = '<p class="note">Searching…</p>';
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&countrycodes=us&q=" + encodeURIComponent(q));
      if (!r.ok) throw new Error("http");
      const list = await r.json();
      if (!list.length) { box.innerHTML = '<p class="note">No match. Add the city and state, or paste a map link instead.</p>'; return; }
      box.innerHTML = list.map((x, i) => '<button type="button" class="btn block" style="justify-content:flex-start;text-align:left;margin-bottom:6px;height:auto;padding:10px 14px" data-pick="' + i + '">' + esc(x.display_name) + "</button>").join("") + '<p class="note">Address search by OpenStreetMap.</p>';
      box.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
        const x = list[Number(b.dataset.pick)];
        document.querySelector('[data-f="lat"]').value = +Number(x.lat).toFixed(6); document.querySelector('[data-f="lon"]').value = +Number(x.lon).toFixed(6);
        box.innerHTML = ""; preview();
      }));
    } catch (e) { box.innerHTML = '<p class="note">Address search isn’t available right now (offline or blocked). Paste a map link or use your location.</p>'; }
  });
  document.querySelectorAll("#sheetBody [data-f]").forEach((el) => { el.addEventListener("input", preview); el.addEventListener("change", preview); });
  $("bSave").addEventListener("click", async () => {
    const d = draft(), err = $("formErr");
    if (!d.name) { err.textContent = "Enter a name for this pursuit."; return; }
    if (!has(d.lat) || !has(d.lon)) { err.textContent = "Add a location: paste a map link or coordinates."; return; }
    if (Math.abs(d.lat) > 90 || Math.abs(d.lon) > 180) { err.textContent = "Those coordinates are out of range."; return; }
    err.textContent = ""; $("bSave").disabled = true; $("bSave").textContent = "Saving…";
    const out = { ...d }; delete out.id;
    out.createdAt = existing ? num(existing.createdAt) : Date.now(); out.createdBy = existing ? (existing.createdBy ?? null) : (ENV.me && ENV.me.id) || null; out.updatedAt = Date.now(); out.sentAt = null;
    try { const id = await savePursuit({ ...out, id: existing ? existing.id : null }); sheetClose(); toast(isNew ? "Pursuit saved" : "Changes saved"); setTimeout(() => { if (R && R.results.find((x) => x.p.id === id)) openDetail(id); }, 350); }
    catch (e) { $("bSave").disabled = false; $("bSave").textContent = isNew ? "Save pursuit" : "Save changes"; err.textContent = e && e.code === "invalid_argument" ? "You have view-only access, so this can’t be saved. Ask the owner for edit access." : "Couldn’t save. Check your connection and try again."; }
  });
  preview();
}
$("fab").addEventListener("click", () => { if (!ENV.canWrite) { toast("You have view-only access."); return; } openForm(null); });

/* ---------- map (schematic, no basemap) ---------- */
function vMap() {
  const offs = S.offices.filter((o) => o.name && has(o.lat) && has(o.lon));
  const pts = R.results.filter((r) => has(r.p.lat) && has(r.p.lon));
  if (!offs.length && !pts.length) return '<div class="empty"><h2>Nothing to plot</h2><p>Add offices in Setup and drop a pin to see them here.</p></div>';
  const A = S.A, tierT = (n) => ((S.tiers.find((t) => t.name === n) || { target: 2 }).target);
  const ringT = mapRing === "D" ? tierT("D - Premier") : tierT("C - Preferred");
  const ringMi = Math.max(0, (ringT - A.mobil) * A.speed / A.circ);   // straight-line miles
  let sel = [...offs.map((o) => ({ lat: num(o.lat), lon: num(o.lon) })), ...pts.map((r) => ({ lat: num(r.p.lat), lon: num(r.p.lon) }))];
  if (mapFocus !== "all") { const fo = offs.find((o) => o.name === mapFocus); if (fo) { const k = ringMi * 1.35 / 69; sel = [{ lat: num(fo.lat) + k, lon: num(fo.lon) - k / Math.cos(rad(num(fo.lat))) }, { lat: num(fo.lat) - k, lon: num(fo.lon) + k / Math.cos(rad(num(fo.lat))) }]; } }
  const lat0 = sel.reduce((a, s) => a + s.lat, 0) / sel.length, kx = Math.cos(rad(lat0)) * 69.17, ky = 69.05;
  const X = (lon) => lon * kx, Y = (lat) => -lat * ky;
  const xs = sel.map((s) => X(s.lon)), ys = sel.map((s) => Y(s.lat));
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padMi = Math.max(40, (x1 - x0 + y1 - y0) * 0.09); x0 -= padMi; x1 += padMi; y0 -= padMi; y1 += padMi;
  const W = 360, spanX = x1 - x0, spanY = y1 - y0, sc = Math.min(W / spanX, 460 / spanY), H = Math.max(200, spanY * sc), offX = (W - spanX * sc) / 2;
  const px = (lon) => offX + (X(lon) - x0) * sc, py = (lat) => (Y(lat) - y0) * sc;
  let svg = '<svg viewBox="0 0 ' + W + " " + Math.round(H) + '" role="img" aria-label="Schematic map of offices, response rings and pursuits"><rect width="' + W + '" height="' + Math.round(H) + '" fill="var(--paper)"/>';
  offs.forEach((o) => { svg += '<circle cx="' + px(num(o.lon)).toFixed(1) + '" cy="' + py(num(o.lat)).toFixed(1) + '" r="' + (ringMi * sc).toFixed(1) + '" fill="var(--accent-soft)" fill-opacity=".55" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>'; });
  offs.forEach((o) => { const cx = px(num(o.lon)), cy = py(num(o.lat)); const left = cx > W - 100; svg += '<rect x="' + (cx - 5).toFixed(1) + '" y="' + (cy - 5).toFixed(1) + '" width="10" height="10" fill="var(--ink)"/><text x="' + (left ? cx - 9 : cx + 9).toFixed(1) + '" y="' + (cy - 8).toFixed(1) + '" text-anchor="' + (left ? "end" : "start") + '" font-size="11" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3">' + esc(o.name) + "</text>"; });
  const col = { "GO": "var(--go)", "CONDITIONAL": "var(--warn)", "NO-GO": "var(--stop)", "INCOMPLETE DATA": "var(--idle)" };
  pts.forEach((r) => {
    const cx = px(num(r.p.lon)), cy = py(num(r.p.lat));
    svg += '<g data-open="' + esc(r.p.id) + '" tabindex="0" role="button" aria-label="' + esc(r.p.name) + ', ' + REC[r.rec] + '" style="cursor:pointer"><circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="14" fill="transparent"/><circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="6.5" fill="' + col[r.rec] + '" stroke="var(--surface)" stroke-width="2"/></g>';
  });
  svg += "</svg>";
  const opts = '<option value="all"' + (mapFocus === "all" ? " selected" : "") + ">Show everything</option>" + offs.map((o) => '<option value="' + esc(o.name) + '"' + (mapFocus === o.name ? " selected" : "") + ">Zoom to " + esc(o.name) + "</option>").join("");
  return '<div class="g2"><label class="fld"><span>View</span><select id="mapFocus">' + opts + '</select></label><label class="fld"><span>Response rings</span><select id="mapRing"><option value="D"' + (mapRing === "D" ? " selected" : "") + ">Premier, " + tierT("D - Premier") + " hr</option><option value=\"C\"" + (mapRing === "C" ? " selected" : "") + ">Preferred, " + tierT("C - Preferred") + " hr</option></select></label></div>" +
    '<div class="mapbox">' + svg + "</div>" +
    '<div class="legend"><span><i style="background:var(--ink);border-radius:0"></i>Office</span><span><i style="background:var(--go)"></i>Go</span><span><i style="background:var(--warn)"></i>Conditional</span><span><i style="background:var(--stop)"></i>No-go</span><span><i style="background:var(--idle)"></i>Incomplete</span></div>' +
    '<p class="note">Schematic only, with no street map. Rings show how far a technician can drive and still meet the response clock.' + (mapFocus === "all" && offs.length > 1 ? ' Offices far apart look small here: choose “Zoom to” an office for detail.' : '') + ' Tap a dot to open it, then use Apple Maps or Google Maps for directions.</p>';
}

/* ---------- more: settings, send, QR, export ---------- */
function vSetup() {
  const esc2 = esc;
  let h = '<h3 class="sec">Send results</h3>' +
    '<label class="fld"><span>Your name</span><input id="setWho" autocomplete="name" value="' + esc2(ENV.who) + '" placeholder="So the office knows who sent it"></label>' +
    '<label class="fld"><span>Send to (email)</span><input id="setTo" type="email" inputmode="email" autocomplete="email" value="' + esc2(ENV.sendTo) + '" placeholder="office@yourcompany.com"><small>Used by the Email option on the Send screen.</small></label>';
  h += '<h3 class="sec">Offices</h3>' + (S.offices.length ? '<div class="card-list">' + S.offices.map((o) => '<div><h4 style="margin:0 0 2px">' + esc2(o.name) + '</h4><span class="note" style="display:block;margin:0">' + num(o.mech) + " mechanics, " + num(o.ctrl) + " controls techs</span></div>").join("") + "</div>" : '<div class="empty">No offices are set up in this copy of the app.</div>');
  h += '<h3 class="sec">How it screens</h3><p class="note">A pursuit passes four checks: it must be inside the response range of an office, the office must have capacity, there must be enough technicians for an on-call rotation, and the margin must clear the walk-away level. ' +
    S.tiers.filter((t) => num(t.target) > 0).map((t) => esc2(t.name) + " needs a " + t.target + "-hour on-site response").join("; ") + ".</p>" +
    '<p class="note">Offices and assumptions are set by the office and update when the app is republished. Settings as of ' + esc2(CONFIG.stamp || "") + ".</p>";
  h += '<h3 class="sec">This app</h3><div class="btns"><button class="btn pri" type="button" id="bQR">Share this app (QR code)</button><button class="btn" type="button" id="bDl">Download my pursuits (CSV)</button></div>' +
    '<div class="btns"><button class="btn danger" type="button" id="bClear">Delete all my pursuits</button></div>' +
    '<p class="note">Pursuits are stored on this phone only. Send them to the office to keep them, since clearing browser data erases them.</p>';
  return h;
}
function bindSetup() {
  $("setWho").addEventListener("input", () => { ENV.who = $("setWho").value; persist(); });
  $("setTo").addEventListener("input", () => { ENV.sendTo = $("setTo").value.trim(); persist(); });
  $("bQR").addEventListener("click", openQR);
  $("bDl").addEventListener("click", () => { const m = buildMessage(sortedPursuits()); downloadFile("pursuits_for_master_workbook.csv", m.csv); });
  const c = $("bClear"); let armed = false;
  c.addEventListener("click", () => {
    if (!armed) { armed = true; c.textContent = "Tap again to delete everything"; c.classList.add("armed"); setTimeout(() => { armed = false; c.textContent = "Delete all my pursuits"; c.classList.remove("armed"); }, 3500); return; }
    S.pursuits = []; persist(); recompute(); toast("All pursuits deleted");
  });
}
const MASTER_HEAD = ["Opportunity / customer", "Support tier", "Site latitude", "Site longitude", "Mechanical hrs/yr", "Controls hrs/yr", "PM visits/yr", "Corrective visits/yr (business hrs)", "After-hours call-outs/yr", "(Optional) RFP on-site response requirement (hrs)", "(Optional) 24/7 field coverage required?", "Annual contract revenue ($)", "Parts, monitoring & tool costs ($/yr)", "Strategic adjustment (-10 to +10 pts)", "Notes", "Project type (for the estimate)", "Project size (unit shown on Project Types)", "(Optional) Complexity factor (1 = typical)"];
function buildMessage(list) {
  const rows = list.map((p) => [p.name, p.tier, p.lat, p.lon, p.mech, p.ctrl, p.pm, p.corr, p.calls, p.rfp, p.ah, p.rev, p.other, p.strat, p.notes, p.ptype, p.psize, p.cx]);
  const q = (v) => { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const csv = [MASTER_HEAD, ...rows].map((r) => r.map(q).join(",")).join("\n");
  const tsv = rows.map((r) => r.map((v) => String(v ?? "").replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n");
  const lines = list.map((p, i) => { const r = R.results.find((x) => x.p.id === p.id); return (i + 1) + ". " + p.name + (r ? ": " + REC[r.rec] + " (score " + Math.round(r.score) + ")" + (r.ok ? ", from " + r.office + ", " + r.hrs.toFixed(1) + " hr drive" : "") : ""); });
  const who = ENV.who.trim();
  return {
    subject: "Pursuit screen: " + list.length + " pursuit" + (list.length > 1 ? "s" : "") + (who ? " from " + who : ""), csv,
    text: "Pursuits" + (who ? " from " + who : "") + " (" + list.length + ")\n\n" + lines.join("\n") + "\n\nRows for the master workbook (Opportunities tab, paste at column B):\n" + tsv
  };
}
function downloadFile(name, text) {
  try { const b = new Blob([text], { type: "text/csv" }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch (e) { toast("Download isn’t available here. Use Send, then Copy rows."); }
}
function openSend(list) {
  if (!list.length) { toast("Nothing to send"); return; }
  const canShare = typeof navigator.share === "function";
  const body = '<p style="margin:0 0 12px"><b>' + list.length + " pursuit" + (list.length > 1 ? "s" : "") + "</b> to send: " + esc(list.map((p) => p.name).join("; ")) + "</p>" +
    '<label class="fld"><span>Your name</span><input id="sWho" autocomplete="name" value="' + esc(ENV.who) + '"></label>' +
    '<label class="fld"><span>Send to (email)</span><input id="sTo" type="email" inputmode="email" autocomplete="email" value="' + esc(ENV.sendTo) + '" placeholder="office@yourcompany.com"></label>' +
    '<div class="btns" style="flex-direction:column">' + (canShare ? '<button class="btn pri block" type="button" id="sShare">Share (Messages, Teams, email, any app)</button>' : "") +
    '<button class="btn ' + (canShare ? "" : "pri ") + 'block" type="button" id="sMail">Email</button><button class="btn block" type="button" id="sCopy">Copy rows</button></div>' +
    '<p class="note">The message lists each result and includes rows that paste straight into the master workbook. Email opens your mail app, so tap Mark as sent after you send it.</p>' +
    '<div class="btns"><button class="btn block" type="button" id="sMark">Mark as sent</button></div>';
  sheetOpen("Send to the office", body, "");
  const sync = () => { ENV.who = $("sWho").value; ENV.sendTo = $("sTo").value.trim(); persist(); return buildMessage(list); };
  const sh = $("sShare");
  if (sh) sh.addEventListener("click", async () => { const m = sync(); try { await navigator.share({ title: m.subject, text: m.text }); markSent(list); sheetClose(); toast("Marked as sent"); } catch (e) { if (!e || e.name !== "AbortError") toast("Sharing isn’t available. Try Email or Copy rows."); } });
  $("sMail").addEventListener("click", () => { const m = sync(); window.location.href = "mailto:" + encodeURIComponent(ENV.sendTo).replace(/%40/g, "@") + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.text); toast("Your mail app should open. Tap Mark as sent after sending."); });
  $("sCopy").addEventListener("click", async () => { const m = sync(); try { await navigator.clipboard.writeText(m.text); toast("Copied. Paste it into a message or email."); } catch (e) { toast("Couldn’t copy. Long-press to select instead."); } });
  $("sMark").addEventListener("click", () => { markSent(list); sheetClose(); toast("Marked as sent"); });
}
function openQR() {
  const url = location.origin + location.pathname;
  let inner;
  if (/^https?:/.test(location.protocol) && typeof qrcode === "function") {
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    inner = '<div style="background:#fff;padding:12px;max-width:320px;margin:0 auto">' + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div><p class="note" style="text-align:center;word-break:break-all">' + esc(url) + "</p><p class=\"note\">Anyone who scans this opens the app in their browser. Take a screenshot to print or send it.</p>";
  } else inner = '<div class="banner">The QR code appears once this page is hosted at a web address. Open the hosted link, then come back here.</div>';
  sheetOpen("Share this app", inner, "");
}

/* ============================ boot ============================ */
loadLocal(); setSync(); recompute();
</script>
